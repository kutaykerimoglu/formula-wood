name: Pull request

on:
  pull_request:

concurrency:
  group: preview
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Smoke checks
        run: npm run check

      # One shared preview Worker with its own database; the latest PR push wins.
      - name: Deploy preview
        id: preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --remote --env preview
          npx wrangler deploy --env preview | tee deploy.log
          echo "url=$(grep -oE 'https://[^ ]+workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Comment preview link
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --edit-last --create-if-none \
            --body "Preview for ${{ github.event.pull_request.head.sha }}: ${{ steps.preview.outputs.url }}"
